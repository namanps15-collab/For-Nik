name: Daily update

on:
  schedule:
    # 01:30 UTC = 07:00 IST, so the feed is fresh before you open it.
    # GitHub's scheduler can run late under load; this is normal.
    - cron: "30 1 * * *"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the latest feed items
        run: node scripts/fetch-feeds.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update live feed — $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
